<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Heetam Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#0F0C09; --panel:#181310; --panel-2:#211A14; --line:#30261D; --line-2:#3E3125;
  --ink:#F3ECE2; --muted:#A89A87; --dim:#7B6E5E;
  --gold:#D9A441; --gold-hi:#F3CD74; --on-gold:#1A1206;
  --ok:#78C08A; --warn:#E9B949; --bad:#EE7D72; --ship:#86AEEA;
  --display:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Butang */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:progress}

/* Login */
.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px 28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.login img{height:54px;width:auto;align-self:center}
.login h1{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.02em;margin:0;text-align:center}
.login p.sub{margin:-10px 0 4px;text-align:center;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=password],input[type=text],input[type=search]{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg)}
input:focus{outline:none;border-color:var(--gold)}
.err{color:var(--bad);font-size:14px;margin:0}
.err:empty{display:none}

/* Header app */
.topbar{position:sticky;top:0;z-index:5;background:rgba(15,12,9,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand img{height:38px;width:auto;display:block}
.brand span{font-family:var(--display);font-size:22px;letter-spacing:.06em;color:var(--muted);border-left:1px solid var(--line-2);padding-left:14px}
.top-actions{display:flex;gap:8px;align-items:center}

/* Ringkasan */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-block:24px 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.stat .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:40px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--dim)}
.stat.alert{border-color:rgba(233,185,73,.55);background:linear-gradient(180deg,rgba(233,185,73,.10),var(--panel) 70%)}
.stat.alert .v{color:var(--warn)}
@media (max-width:860px){.stats{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.toolbar{flex-direction:column;align-items:stretch}.seg{flex-wrap:nowrap;overflow-x:auto}.seg button{flex:0 0 auto}.tools{flex-wrap:nowrap}.tools input{flex:1;min-width:0;width:auto}.brand span{display:none}.stat .v{font-size:32px}}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg .n{font-size:12px;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:20px;padding:0 7px;min-width:22px;text-align:center;color:var(--muted)}
.seg button[data-st=paid] .n.on{background:var(--warn);color:var(--on-gold)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{width:240px;max-width:100%}

/* Senarai order */
.list{display:flex;flex-direction:column;gap:12px;padding-bottom:72px}
.order{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.order-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.oid{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.when{color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;margin-left:8px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-paid{color:var(--warn);background:rgba(233,185,73,.12)}
.b-shipped{color:var(--ship);background:rgba(134,174,234,.12)}
.b-pending{color:var(--muted);background:rgba(168,154,135,.12)}
.b-failed{color:var(--bad);background:rgba(238,125,114,.12)}
.b-test{color:var(--gold-hi);background:transparent;border:1px dashed var(--gold);font-weight:600}
.b-test::before{display:none}
.order-body{display:grid;grid-template-columns:1.15fr 1fr .85fr;gap:0}
.order-body > section{padding:16px 18px;min-width:0}
.order-body > section + section{border-left:1px solid var(--line)}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.items{margin:0;padding:0;list-style:none;font-size:14px}
.items li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.items li .q{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.sumrow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);padding-top:6px}
.sumrow.total{color:var(--ink);font-weight:700;font-size:15px}
.note{margin-top:10px;font-size:13.5px;background:rgba(217,164,65,.08);border-left:3px solid var(--gold);padding:6px 10px;border-radius:4px}
.addr{font-size:14px;white-space:pre-line;word-break:break-word;line-height:1.55}
.addr b{font-weight:700}
.email{color:var(--muted);font-size:13px;margin-top:6px;word-break:break-all}
.ship{display:flex;flex-direction:column;gap:8px}
.ship .done{font-size:14px}
.ship .trk{font-weight:700;font-variant-numeric:tabular-nums;word-break:break-all}
.muted{color:var(--muted);font-size:13.5px;margin:0}
@media (max-width:860px){
  .order-body{grid-template-columns:1fr}
  .order-body > section + section{border-left:0;border-top:1px solid var(--line)}
}

/* Kosong */
.empty{background:var(--panel);border:1px dashed var(--line-2);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Jadual customer */
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--panel-2)}
tr:last-child td{border-bottom:0}
.yes{color:var(--ok);font-weight:600}
.meta-line{color:var(--muted);font-size:13.5px;margin:0 0 10px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Produk & testimoni */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--bg);display:block}
.pcard .noimg{width:100%;aspect-ratio:1/1;display:grid;place-items:center;color:var(--dim);background:var(--bg);font-size:13px}
.pcard .pb{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .pn{font-weight:700}
.pcard .pc{color:var(--muted);font-size:13px}
.pcard .pp{font-variant-numeric:tabular-nums;font-size:13.5px;margin-top:2px}
.pcard .pa{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}
.pcard.off{opacity:.55}
.vis{font-size:12px;font-weight:700}
.vis.on{color:var(--ok)} .vis.off{color:var(--dim)}
.addbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.addbar p{margin:0;color:var(--muted);font-size:13.5px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}
.tcard q{font-size:14px;color:var(--ink)}
.tcard .tw{color:var(--muted);font-size:13px}
/* Borang edit */
.modal{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end}
.modal .scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.modal .panel{position:relative;width:min(560px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.modal .ph{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .ph h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em}
.modal .pbody{flex:1;overflow:auto;padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .pbody .full{grid-column:1/-1}
.modal .pf{display:flex;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.modal input[type=text],.modal input[type=number],.modal textarea,.modal select{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg);font-size:15px}
.modal textarea{resize:vertical;min-height:90px}
.modal .hint{font-size:12.5px;color:var(--dim)}
.imgpick{display:flex;gap:14px;align-items:center}
.imgpick .prev{width:120px;height:120px;border-radius:12px;background:var(--bg);border:1px dashed var(--line-2);object-fit:cover;flex:0 0 auto;display:grid;place-items:center;color:var(--dim);font-size:12px;overflow:hidden}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.imgpick .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--gold)}
.btn.danger{border-color:rgba(238,125,114,.5);color:var(--bad);background:transparent}
.btn.danger:hover{border-color:var(--bad)}
@media (max-width:560px){.modal .pbody{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <form class="login" id="login">
    <img src="/img/logo.png" alt="Heetam Coffee" width="255" height="80">
    <h1>Admin Order</h1>
    <p class="sub">Log masuk untuk urus order dan customer</p>
    <div class="field">
      <label for="pw">Kata laluan</label>
      <input type="password" id="pw" autocomplete="current-password" required>
    </div>
    <p class="err" id="login-err"></p>
    <button class="btn gold" type="submit" id="login-btn">Masuk</button>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="/" title="Buka kedai"><img src="/img/logo.png" alt="Heetam Coffee" width="255" height="80"><span>Admin</span></a>
      <div class="top-actions">
        <button class="btn sm ghost" type="button" id="reload">Muat semula</button>
        <button class="btn sm ghost" type="button" id="logout">Log keluar</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="stats">
      <div class="stat" id="stat-topost"><div class="k">Perlu dipos</div><div class="v" id="s-topost">0</div><div class="s">order dah dibayar</div></div>
      <div class="stat"><div class="k">Jualan hari ini</div><div class="v" id="s-day">RM0</div><div class="s">tidak termasuk order test</div></div>
      <div class="stat"><div class="k">Jualan bulan ini</div><div class="v" id="s-month">RM0</div><div class="s" id="s-month-n">0 order</div></div>
      <div class="stat"><div class="k">Dah dipos</div><div class="v" id="s-shipped">0</div><div class="s">keseluruhan</div></div>
    </div>

    <div class="toolbar">
      <div class="seg" id="tabs" role="group" aria-label="Paparan">
        <button type="button" data-st="paid" aria-pressed="true">Perlu Pos <span class="n" data-count="paid">0</span></button>
        <button type="button" data-st="shipped" aria-pressed="false">Dipos <span class="n" data-count="shipped">0</span></button>
        <button type="button" data-st="pending" aria-pressed="false">Belum Bayar <span class="n" data-count="pending">0</span></button>
        <button type="button" data-st="failed" aria-pressed="false">Gagal <span class="n" data-count="failed">0</span></button>
        <button type="button" data-st="all" aria-pressed="false">Semua</button>
        <button type="button" data-st="customers" aria-pressed="false">Customer</button>
        <button type="button" data-st="products" aria-pressed="false">Produk</button>
        <button type="button" data-st="testimonials" aria-pressed="false">Testimoni</button>
      </div>
      <div class="tools">
        <label for="q" style="position:absolute;left:-9999px">Cari</label>
        <input type="search" id="q" placeholder="Cari nama, telefon, no. order">
        <button class="btn sm gold" type="button" id="csv">Export CSV</button>
      </div>
    </div>

    <div id="list" class="list"></div>
  </main>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="scrim" data-mclose></div>
  <form class="panel" id="mform" novalidate>
    <div class="ph"><h2 id="modal-title">Edit</h2><button class="btn sm ghost" type="button" data-mclose>Tutup</button></div>
    <div class="pbody" id="mbody"></div>
    <div class="pf"><button class="btn danger sm" type="button" id="mdelete">Padam</button><div style="display:flex;gap:8px"><button class="btn ghost" type="button" data-mclose>Batal</button><button class="btn gold" type="submit" id="msave">Simpan</button></div></div>
  </form>
</div>
<input type="file" id="filepick" accept="image/jpeg,image/png,image/webp" hidden>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var KEY = "heetam_admin_pw";
  var pw = ""; try { pw = sessionStorage.getItem(KEY) || ""; } catch(e){}
  var tab = "paid", data = [], customers = [], counts = {}, summary = {};
  function $(s){ return document.querySelector(s); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function sen(n){ return "RM" + (Number(n||0)/100).toFixed(2); }
  function senShort(n){ var v = Number(n||0)/100; return "RM" + (v % 1 === 0 ? v.toLocaleString("en-MY") : v.toLocaleString("en-MY", {minimumFractionDigits:2, maximumFractionDigits:2})); }
  function dt(s){ if (!s) return "-"; return new Date(s).toLocaleString("ms-MY", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", timeZone:"Asia/Kuala_Lumpur"}); }
  var tt; function toast(m){ var t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove("show"); }, 2400); }
  var LABEL = {paid:"Dibayar", pending:"Belum bayar", shipped:"Dipos", failed:"Gagal"};

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({"authorization":"Bearer " + pw, "content-type":"application/json"}, opts.headers || {});
    return fetch(path, opts).then(function(r){
      return r.json().catch(function(){ return {ok:false, error:"Ralat server ("+r.status+")."}; }).then(function(j){
        if (r.status === 401){ logout(); throw new Error(j.error || "Kata laluan salah."); }
        if (!j.ok) throw new Error(j.error || "Ralat");
        return j;
      });
    });
  }
  function showLogin(){ $("#app").hidden = true; $("#login-screen").hidden = false; setTimeout(function(){ $("#pw").focus(); }, 30); }
  function showApp(){ $("#login-screen").hidden = true; $("#app").hidden = false; }
  function logout(){ pw = ""; try { sessionStorage.removeItem(KEY); } catch(e){} $("#pw").value = ""; showLogin(); }

  $("#login").addEventListener("submit", function(e){
    e.preventDefault();
    var btn = $("#login-btn"); btn.disabled = true; btn.textContent = "Menyemak…";
    pw = $("#pw").value; $("#login-err").textContent = "";
    api("/api/admin/orders?status=paid").then(function(j){
      try { sessionStorage.setItem(KEY, pw); } catch(e){}
      showApp(); apply(j);
    }).catch(function(err){ $("#login-err").textContent = err.message; }).then(function(){ btn.disabled = false; btn.textContent = "Masuk"; });
  });
  $("#logout").addEventListener("click", logout);

  function apply(j){ data = j.orders; counts = j.counts || {}; summary = j.summary || {}; render(); }
  var products = [], testimonials = [];
  function load(){
    $("#list").innerHTML = '<div class="empty">Memuatkan…</div>';
    $("#csv").hidden = (tab === "products" || tab === "testimonials");
    if (tab === "products"){
      return api("/api/admin/products").then(function(j){ products = j.products; render(); }).catch(function(e){ $("#list").innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
    }
    if (tab === "testimonials"){
      return api("/api/admin/testimonials").then(function(j){ testimonials = j.testimonials; render(); }).catch(function(e){ $("#list").innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
    }
    if (tab === "customers"){
      return api("/api/admin/customers").then(function(j){ customers = j.customers; render(); }).catch(function(e){ $("#list").innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
    }
    api("/api/admin/orders?status=" + tab).then(apply).catch(function(e){ $("#list").innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
  }
  function matchQ(o){
    var q = $("#q").value.trim().toLowerCase(); if (!q) return true;
    return [o.id, o.name, o.phone, o.email, o.city, o.state].join(" ").toLowerCase().indexOf(q) >= 0;
  }
  function addrText(o){ return o.name + "\n" + o.phone + "\n" + o.addr1 + (o.addr2 ? "\n" + o.addr2 : "") + "\n" + o.postcode + " " + o.city + "\n" + o.state; }

  function renderStats(){
    var topost = counts.paid || 0;
    $("#s-topost").textContent = topost;
    $("#stat-topost").classList.toggle("alert", topost > 0);
    $("#s-day").textContent = senShort(summary.day_total);
    $("#s-month").textContent = senShort(summary.month_total);
    $("#s-month-n").textContent = (summary.month_orders || 0) + " order dibayar";
    $("#s-shipped").textContent = counts.shipped || 0;
    Array.prototype.forEach.call(document.querySelectorAll("[data-count]"), function(b){
      var n = counts[b.getAttribute("data-count")] || 0; b.textContent = n; b.classList.toggle("on", n > 0);
    });
  }

  var EMPTY = {
    paid: ["Tiada order perlu dipos", "Order baru yang dah dibayar akan keluar di sini."],
    shipped: ["Belum ada order dipos", "Order yang ditandakan Dipos akan keluar di sini."],
    pending: ["Tiada order belum bayar", "Customer yang tak habis bayar di CHIP akan keluar di sini."],
    failed: ["Tiada bayaran gagal", ""],
    all: ["Belum ada order", "Order pertama akan keluar di sini."]
  };

  function render(){
    renderStats();
    if (tab === "products"){ renderProducts(); return; }
    if (tab === "testimonials"){ renderTestimonials(); return; }
    if (tab === "customers"){
      var cs = customers.filter(matchQ);
      if (!cs.length){ $("#list").innerHTML = '<div class="empty"><b>Belum ada customer</b>Customer disimpan bila mereka checkout.</div>'; return; }
      $("#list").innerHTML = '<p class="meta-line">'+cs.length+' customer · '+cs.filter(function(c){ return c.consent; }).length+' setuju terima promo</p><div class="tablewrap"><table><thead><tr><th>Nama</th><th>Telefon</th><th>Emel</th><th>Lokasi</th><th>Order dibayar</th><th>Promo</th><th>Terakhir</th></tr></thead><tbody>'+
        cs.map(function(c){ return '<tr><td>'+esc(c.name)+'</td><td class="num">'+esc(c.phone)+'</td><td>'+esc(c.email)+'</td><td>'+esc(c.city)+', '+esc(c.state)+'</td><td class="num">'+c.order_count+'</td><td>'+(c.consent?'<span class="yes">Ya</span>':'Tidak')+'</td><td>'+dt(c.updated_at)+'</td></tr>'; }).join("")+
        '</tbody></table></div>';
      return;
    }
    var os = data.filter(matchQ);
    if (!os.length){ var e = EMPTY[tab] || EMPTY.all; $("#list").innerHTML = '<div class="empty"><b>'+e[0]+'</b>'+e[1]+'</div>'; return; }
    $("#list").innerHTML = os.map(function(o){
      var items = o.items.map(function(it){
        var desc = it.size === "test" ? "" : ' <span class="q">'+esc(it.size)+' · '+esc(it.grind_label)+'</span>';
        return '<li><span>'+it.qty+'× '+esc(it.name)+desc+'</span><span class="num">'+sen(it.line)+'</span></li>';
      }).join("");
      var ship;
      if (o.status === "paid"){
        ship = '<label class="lbl" for="trk-'+esc(o.id)+'">No. tracking</label><input type="text" id="trk-'+esc(o.id)+'" placeholder="contoh SPXMY0123456789"><button class="btn sm gold" type="button" data-ship="'+esc(o.id)+'">Tandakan Dipos</button>';
      } else if (o.status === "shipped"){
        ship = '<p class="lbl">Dipos</p><p class="done">'+dt(o.shipped_at)+'</p><p class="lbl" style="margin-top:6px">No. tracking</p><p class="trk">'+esc(o.tracking || "-")+'</p>';
      } else if (o.status === "pending"){
        ship = '<p class="lbl">Status</p><p class="muted">Customer belum selesai bayar di CHIP.</p><button class="btn sm" type="button" data-refresh="'+esc(o.id)+'">Semak dengan CHIP</button>';
      } else {
        ship = '<p class="lbl">Status</p><p class="muted">Bayaran gagal atau dibatalkan. Tiada tindakan diperlukan.</p>';
      }
      return '<article class="order">'+
        '<div class="order-head"><div><span class="oid">'+esc(o.id)+'</span><span class="badge b-'+o.status+'">'+(LABEL[o.status]||o.status)+'</span>'+(o.is_test?'<span class="badge b-test">TEST</span>':'')+'</div>'+
          '<span class="when">'+(o.paid_at ? 'Dibayar '+dt(o.paid_at) : 'Dibuat '+dt(o.created_at))+'</span></div>'+
        '<div class="order-body">'+
          '<section><p class="lbl">Item</p><ul class="items">'+items+'</ul>'+
            '<div class="sumrow"><span>Pos</span><span class="num">'+sen(o.postage)+'</span></div>'+
            '<div class="sumrow total"><span>Jumlah</span><span class="num">'+sen(o.total)+'</span></div>'+
            (o.note ? '<div class="note">Nota: '+esc(o.note)+'</div>' : '')+
          '</section>'+
          '<section><p class="lbl">Hantar kepada</p><div class="addr"><b>'+esc(o.name)+'</b>\n'+esc(o.phone)+'\n'+esc(o.addr1)+(o.addr2 ? '\n'+esc(o.addr2) : '')+'\n'+esc(o.postcode)+' '+esc(o.city)+'\n'+esc(o.state)+'</div>'+
            '<p class="email">'+esc(o.email)+'</p>'+
            '<button class="btn sm" type="button" data-copy="'+esc(o.id)+'" style="margin-top:10px">Salin alamat</button></section>'+
          '<section class="ship">'+ship+'</section>'+
        '</div>'+
      '</article>';
    }).join("");
  }

  $("#tabs").addEventListener("click", function(e){
    var b = e.target.closest("[data-st]"); if (!b) return;
    tab = b.getAttribute("data-st");
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(x){ x.setAttribute("aria-pressed", x===b ? "true" : "false"); });
    load();
  });
  $("#q").addEventListener("input", render);
  $("#reload").addEventListener("click", load);
  $("#list").addEventListener("click", function(e){
    if (e.target.closest("#add-product")){ openProduct(null); return; }
    if (e.target.closest("#add-testi")){ openTesti(null); return; }
    var ep = e.target.closest("[data-editp]");
    if (ep){ openProduct(products.filter(function(p){ return p.id === ep.getAttribute("data-editp"); })[0]); return; }
    var et = e.target.closest("[data-editt]");
    if (et){ openTesti(testimonials.filter(function(t){ return String(t.id) === et.getAttribute("data-editt"); })[0]); return; }
    var s = e.target.closest("[data-ship]");
    if (s){
      var id = s.getAttribute("data-ship"), trk = document.getElementById("trk-" + id).value.trim();
      if (!trk){ toast("Masukkan no. tracking dulu."); document.getElementById("trk-" + id).focus(); return; }
      s.disabled = true;
      api("/api/admin/ship", {method:"POST", body: JSON.stringify({id:id, tracking:trk})}).then(function(){ toast(id + " ditandakan Dipos."); load(); }).catch(function(err){ s.disabled = false; toast(err.message); });
      return;
    }
    var r = e.target.closest("[data-refresh]");
    if (r){
      r.disabled = true;
      api("/api/admin/refresh", {method:"POST", body: JSON.stringify({id:r.getAttribute("data-refresh")})}).then(function(j){ toast("Status: " + (LABEL[j.status] || j.status)); load(); }).catch(function(err){ r.disabled = false; toast(err.message); });
      return;
    }
    var c = e.target.closest("[data-copy]");
    if (c){
      var o = data.filter(function(x){ return x.id === c.getAttribute("data-copy"); })[0];
      navigator.clipboard.writeText(addrText(o)).then(function(){ toast("Alamat disalin."); }, function(){ toast("Tidak dapat salin. Pilih teks alamat secara manual."); });
    }
  });

  /* ---------- Produk ---------- */
  function rmv(sen){ return (Number(sen||0)/100).toFixed(2); }
  function renderProducts(){
    var q = $("#q").value.trim().toLowerCase();
    var ps = products.filter(function(p){ return !q || (p.name + " " + p.cat).toLowerCase().indexOf(q) >= 0; });
    var head = '<div class="addbar"><p>'+products.length+' produk · '+products.filter(function(p){ return p.visible; }).length+' dipapar di kedai</p><button class="btn gold" type="button" id="add-product">+ Tambah Produk</button></div>';
    if (!ps.length){ $("#list").innerHTML = head + '<div class="empty"><b>Tiada produk</b>Tekan Tambah Produk untuk mula.</div>'; return; }
    $("#list").innerHTML = head + '<div class="pgrid">' + ps.map(function(p){
      return '<article class="pcard'+(p.visible?'':' off')+'">'+(p.image ? '<img src="'+esc(p.image)+'" alt="" loading="lazy">' : '<div class="noimg">Tiada gambar</div>')+
        '<div class="pb"><span class="pn">'+esc(p.name)+'</span><span class="pc">'+esc(p.cat || "-")+' · turutan '+p.sort+'</span>'+
        '<span class="pp">500g RM'+rmv(p.price500)+' · 1kg RM'+rmv(p.price1kg)+'</span></div>'+
        '<div class="pa"><span class="vis '+(p.visible?'on':'off')+'">'+(p.visible?'● Dipapar':'○ Disorok')+'</span><button class="btn sm" type="button" data-editp="'+esc(p.id)+'">Edit</button></div></article>';
    }).join("") + '</div>';
  }
  function renderTestimonials(){
    var head = '<div class="addbar"><p>'+testimonials.length+' testimoni · '+testimonials.filter(function(t){ return t.visible; }).length+' dipapar di kedai</p><button class="btn gold" type="button" id="add-testi">+ Tambah Testimoni</button></div>';
    if (!testimonials.length){ $("#list").innerHTML = head + '<div class="empty"><b>Belum ada testimoni</b>Seksyen Testimoni di kedai akan keluar bila ada sekurang-kurangnya satu testimoni dipapar.</div>'; return; }
    $("#list").innerHTML = head + '<div class="tlist">' + testimonials.map(function(t){
      return '<article class="tcard">'+(t.image ? '<img src="'+esc(t.image)+'" alt="" loading="lazy">' : '')+(t.text ? '<q>'+esc(t.text)+'</q>' : '')+
        '<span class="tw"><b>'+esc(t.name)+'</b>'+(t.location ? ' · '+esc(t.location) : '')+'</span>'+
        '<div style="display:flex;justify-content:space-between;align-items:center"><span class="vis '+(t.visible?'on':'off')+'">'+(t.visible?'● Dipapar':'○ Disorok')+'</span><button class="btn sm" type="button" data-editt="'+t.id+'">Edit</button></div></article>';
    }).join("") + '</div>';
  }

  /* ---------- Borang ---------- */
  var mode = null, editing = null, imageUrl = "";
  var CATS = ["Single Origin","Barista Blend","House Blend","Specialty"];
  function fld(id, label, val, opts){
    opts = opts || {};
    var input = opts.textarea
      ? '<textarea id="'+id+'" maxlength="'+(opts.max||300)+'">'+esc(val)+'</textarea>'
      : '<input type="'+(opts.type||"text")+'" id="'+id+'" value="'+esc(val)+'"'+(opts.step?' step="'+opts.step+'" min="0" inputmode="decimal"':'')+(opts.list?' list="'+opts.list+'"':'')+' maxlength="'+(opts.max||200)+'"'+(opts.ph?' placeholder="'+esc(opts.ph)+'"':'')+'>';
    return '<div class="field'+(opts.full?' full':'')+'"><label for="'+id+'">'+label+'</label>'+input+(opts.hint?'<span class="hint">'+opts.hint+'</span>':'')+'</div>';
  }
  function imgField(){
    return '<div class="field full"><label>Gambar (square)</label><div class="imgpick"><div class="prev" id="mprev">'+(imageUrl ? '<img src="'+esc(imageUrl)+'" alt="">' : 'Tiada gambar')+'</div>'+
      '<div class="acts"><button class="btn sm" type="button" id="mpick">'+(imageUrl?'Tukar gambar':'Upload gambar')+'</button>'+(imageUrl?'<button class="btn sm ghost" type="button" id="mclear">Buang gambar</button>':'')+
      '<span class="hint">JPG/PNG. Gambar akan dipotong jadi square secara auto.</span></div></div></div>';
  }
  function openProduct(p){
    mode = "product"; editing = p || null; imageUrl = p ? p.image : "";
    $("#modal-title").textContent = p ? "Edit Produk" : "Tambah Produk";
    $("#mdelete").hidden = !p;
    p = p || {visible:1, sort:100};
    $("#mbody").innerHTML = imgField() +
      fld("f-name","Nama produk *",p.name||"",{full:true,max:80,ph:"contoh: King Gayo"}) +
      fld("f-cat","Kategori",p.cat||"",{list:"catlist",ph:"Single Origin"}) +
      fld("f-tag","Label kecil atas nama",p.tag||"",{ph:"contoh: Barista Blend"}) +
      fld("f-badge","Badge atas gambar",p.badge||"",{ph:"contoh: 100% Arabica"}) +
      '<div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" id="f-strong"'+(p.strong?' checked':'')+'> Badge warna merah</label></div>' +
      fld("f-p500","Harga 500g (RM) *",p.price500?rmv(p.price500):"",{type:"number",step:"0.01"}) +
      fld("f-p1kg","Harga 1kg (RM) *",p.price1kg?rmv(p.price1kg):"",{type:"number",step:"0.01"}) +
      fld("f-origin","Origin",p.origin||"",{full:true}) +
      fld("f-notes","Taste Note",p.notes||"",{full:true,ph:"contoh: Dark Chocolate, Caramel"}) +
      fld("f-aroma","Aroma",p.aroma||"") + fld("f-bean","Jenis biji",p.bean||"",{ph:"100% Arabica"}) +
      fld("f-body","Body",p.body||"") + fld("f-acid","Acidity",p.acid||"") +
      fld("f-after","After Taste",p.after||"") + fld("f-roast","Roast",p.roast||"",{ph:"Medium Dark"}) +
      fld("f-sort","Turutan",p.sort,{type:"number",step:"1",hint:"Nombor kecil keluar dulu."}) +
      '<div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" id="f-visible"'+(p.visible?' checked':'')+'> Papar di kedai</label></div>' +
      '<datalist id="catlist">'+CATS.map(function(c){ return '<option value="'+c+'">'; }).join("")+'</datalist>';
    showModal();
  }
  function openTesti(t){
    mode = "testi"; editing = t || null; imageUrl = t ? t.image : "";
    $("#modal-title").textContent = t ? "Edit Testimoni" : "Tambah Testimoni";
    $("#mdelete").hidden = !t;
    t = t || {visible:1, sort:100};
    $("#mbody").innerHTML = imgField() +
      fld("f-tname","Nama pelanggan *",t.name||"",{max:60}) +
      fld("f-tloc","Lokasi",t.location||"",{max:60,ph:"contoh: Shah Alam"}) +
      fld("f-ttext","Ayat testimoni",t.text||"",{full:true,textarea:true,max:800,hint:"Boleh kosongkan kalau guna gambar screenshot sahaja."}) +
      fld("f-tsort","Turutan",t.sort,{type:"number",step:"1"}) +
      '<div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" id="f-tvisible"'+(t.visible?' checked':'')+'> Papar di kedai</label></div>';
    showModal();
  }
  function showModal(){ $("#modal").hidden = false; document.body.style.overflow = "hidden"; setTimeout(function(){ var f = $("#mbody input[type=text]"); if (f) f.focus(); }, 30); }
  function hideModal(){ $("#modal").hidden = true; document.body.style.overflow = ""; }
  function refreshImg(){
    var box = $("#mbody .imgpick"); if (!box) return;
    box.parentNode.outerHTML = imgField();
  }
  $("#modal").addEventListener("click", function(e){
    if (e.target.closest("[data-mclose]")){ hideModal(); return; }
    if (e.target.closest("#mpick")){ $("#filepick").value = ""; $("#filepick").click(); return; }
    if (e.target.closest("#mclear")){ imageUrl = ""; refreshImg(); }
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("#modal").hidden) hideModal(); });

  function squareJpeg(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var side = Math.min(img.naturalWidth, img.naturalHeight), out = Math.min(1000, side);
        var c = document.createElement("canvas"); c.width = out; c.height = out;
        var ctx = c.getContext("2d");
        ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? resolve(b) : reject(new Error("Tidak dapat proses gambar.")); }, "image/jpeg", 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Fail ini bukan gambar yang boleh dibaca.")); };
      img.src = url;
    });
  }
  $("#filepick").addEventListener("change", function(){
    var f = this.files && this.files[0]; if (!f) return;
    var btn = $("#mpick"); if (btn){ btn.disabled = true; btn.textContent = "Memuat naik…"; }
    squareJpeg(f).then(function(blob){
      return fetch("/api/admin/upload", {method:"POST", headers:{"authorization":"Bearer " + pw, "x-content-type":"image/jpeg"}, body: blob}).then(function(r){ return r.json(); });
    }).then(function(j){
      if (!j.ok) throw new Error(j.error || "Upload gagal.");
      imageUrl = j.url; refreshImg(); toast("Gambar dimuat naik. Tekan Simpan.");
    }).catch(function(err){ toast(err.message); refreshImg(); });
  });

  $("#mform").addEventListener("submit", function(e){
    e.preventDefault();
    var v = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; };
    var ck = function(id){ var el = document.getElementById(id); return el ? el.checked : false; };
    var body, path;
    if (mode === "product"){
      if (!v("f-name")){ toast("Isi nama produk."); return; }
      if (!(parseFloat(v("f-p500")) > 0) || !(parseFloat(v("f-p1kg")) > 0)){ toast("Isi harga 500g dan 1kg."); return; }
      path = "/api/admin/products";
      body = {id: editing ? editing.id : "", name:v("f-name"), cat:v("f-cat"), tag:v("f-tag"), badge:v("f-badge"), strong:ck("f-strong"),
        price500:v("f-p500"), price1kg:v("f-p1kg"), origin:v("f-origin"), notes:v("f-notes"), aroma:v("f-aroma"), bean:v("f-bean"),
        body:v("f-body"), acid:v("f-acid"), after:v("f-after"), roast:v("f-roast"), sort:v("f-sort"), visible:ck("f-visible"), image:imageUrl};
    } else {
      if (!v("f-tname")){ toast("Isi nama pelanggan."); return; }
      path = "/api/admin/testimonials";
      body = {id: editing ? editing.id : "", name:v("f-tname"), location:v("f-tloc"), text:v("f-ttext"), sort:v("f-tsort"), visible:ck("f-tvisible"), image:imageUrl};
    }
    var btn = $("#msave"); btn.disabled = true;
    api(path, {method:"POST", body: JSON.stringify(body)}).then(function(){ hideModal(); toast("Disimpan."); load(); })
      .catch(function(err){ toast(err.message); }).then(function(){ btn.disabled = false; });
  });
  var confirmDel = 0;
  $("#mdelete").addEventListener("click", function(){
    var btn = this;
    if (Date.now() - confirmDel > 4000){ confirmDel = Date.now(); btn.textContent = "Tekan sekali lagi untuk padam"; setTimeout(function(){ btn.textContent = "Padam"; }, 4000); return; }
    confirmDel = 0;
    var path = mode === "product" ? "/api/admin/products/delete" : "/api/admin/testimonials/delete";
    api(path, {method:"POST", body: JSON.stringify({id: editing.id})}).then(function(){ hideModal(); toast("Dipadam."); load(); }).catch(function(err){ toast(err.message); });
  });

  function csvCell(v){ v = String(v==null?"":v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
  $("#csv").addEventListener("click", function(){
    var rows;
    if (tab === "customers"){
      rows = [["Nama","Telefon","Emel","Bandar","Negeri","Order dibayar","Setuju promo","Kemas kini"]].concat(customers.filter(matchQ).map(function(c){ return [c.name,c.phone,c.email,c.city,c.state,c.order_count,c.consent?"Ya":"Tidak",c.updated_at]; }));
    } else {
      rows = [["No. Order","Status","Tarikh","Nama","Telefon","Emel","Alamat 1","Alamat 2","Poskod","Bandar","Negeri","Item","Berat (kg)","Subtotal (RM)","Pos (RM)","Jumlah (RM)","Nota","Tracking"]].concat(data.filter(matchQ).map(function(o){
        var kg = o.items.reduce(function(a,it){ return a + (it.size==="1kg"?1:it.size==="500g"?0.5:0) * it.qty; }, 0);
        return [o.id, LABEL[o.status]||o.status, o.created_at, o.name, o.phone, o.email, o.addr1, o.addr2, o.postcode, o.city, o.state,
          o.items.map(function(it){ return it.name + (it.size!=="test" ? " " + it.size + " " + it.grind_label : "") + " x" + it.qty; }).join("; "),
          kg, (o.subtotal/100).toFixed(2), (o.postage/100).toFixed(2), (o.total/100).toFixed(2), o.note, o.tracking];
      }));
    }
    if (rows.length < 2){ toast("Tiada data untuk export."); return; }
    var csv = "﻿" + rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
    a.download = "heetam-" + tab + "-" + new Date().toISOString().slice(0,10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  });

  if (pw){ showApp(); load(); } else { showLogin(); }
})();
</script>
</body>
</html>
